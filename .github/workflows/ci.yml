name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev xvfb
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Shipped themes validate
        run: |
          cargo run -q -p hyprgui -- theme check themes/default
          cargo run -q -p hyprgui -- theme check themes/caelestia
      - name: GUI starts under Xvfb
        run: |
          cargo build -p hyprgui
          printf 'general {\n    gaps_in = 5\n}\n' > /tmp/hypr.conf
          GDK_BACKEND=x11 GSK_RENDERER=cairo NO_AT_BRIDGE=1 xvfb-run -a timeout 8 target/debug/hyprgui --config /tmp/hypr.conf --no-ipc || [ $? -eq 124 ]
