[workspace]
resolver = "2"
members = ["crates/hyprconf", "crates/hyprgui-theme", "crates/hypripc", "crates/hyprschema", "crates/hyprgui-core", "crates/hyprgui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/jirkacepelka/HyprGUI"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "1"
serde_json = "1"
