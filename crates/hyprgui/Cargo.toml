[package]
name = "hyprgui"
description = "GUI for configuring Hyprland"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
hyprgui-core = { path = "../hyprgui-core" }
hyprgui-theme = { path = "../hyprgui-theme" }
hyprconf = { path = "../hyprconf" }
hyprschema = { path = "../hyprschema" }
hypripc = { path = "../hypripc" }
gtk = { package = "gtk4", version = "0.9", features = ["v4_10"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_4"] }
toml.workspace = true
serde.workspace = true
